name: Sync new listings into data/krx_map.js

# 신규 상장 종목(주식·스팩·ETF·ETN)을 종목검색 사전에 자동 등록한다. 추가 전용, 키 없음, 상시 프로세스 없음.
# 소스: KIS 공개 종목 마스터 + 네이버 시총 JSON 교차 확인(ETN은 네이버 단독). 세부는 scripts/sync_listings.py.
on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - scripts/sync_listings.py
      - scripts/kis_master.py
      - scripts/krx_map_io.py
      - .github/workflows/listing-sync.yml
  schedule:
    # KST 08:25(장 시작 전 당일 신규 상장 반영)과 16:25(장 마감 후 보완). UTC 23:25 / 07:25.
    - cron: '25 23 * * *'
    - cron: '25 7 * * *'

permissions:
  contents: write

concurrency:
  group: listing-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate sync logic and current krx_map.js
        run: |
          python -m unittest discover -s test -p 'test_sync_listings.py'
          node test/test_krx_map_etn.js
          node test/test_recent_kosdaq_listings.js
          node test/test_utf8_asset_guard.js
      - name: Register new listings and publish only when something changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # 다른 master 배포와 동시에 진행돼도 최신 HEAD 위에서 다시 계산한다(수동 편집을 덮어쓰지 않는다).
          # 스크립트는 멱등이라 재시도해도 안전하다. 소스 이상·급변 가드에 걸리면 파일을 쓰지 않고 실패한다.
          for attempt in 1 2 3; do
            git fetch origin master
            git reset --hard origin/master
            python scripts/sync_listings.py
            git add data/krx_map.js
            if git diff --cached --quiet -- data/krx_map.js; then
              echo "No listing changes"
              exit 0
            fi
            node test/test_krx_map_etn.js
            git commit -m "data(listings): register newly listed securities in krx_map"
            if git push origin HEAD:master; then
              echo "Published listing sync"
              exit 0
            fi
            sleep 3
          done
          echo "Listing sync publication failed after retries" >&2
          exit 1
