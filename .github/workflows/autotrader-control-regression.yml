name: Autotrader control regression
on:
  push:
    branches: [master]
    paths:
      - 'scripts/cloud-vm/autotrader_control.py'
      - 'test/test_autotrader_control.py'
      - 'js/auto-trader.js'
      - 'test/test_autotrader_activity_names.cjs'
      - 'test/test_autotrader_allocation.cjs'
      - 'test/autotrader_allocation_vectors.json'
      - 'quant-autotrade/local_bot/live_sizing.py'
      - 'quant-autotrade/local_bot/test_live_sizing.py'
      - '.github/workflows/autotrader-control-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  safety:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m py_compile scripts/cloud-vm/autotrader_control.py
      - run: python test/test_autotrader_control.py
      - run: node --check js/auto-trader.js
      - run: node test/test_autotrader_activity_names.cjs
      - run: node test/test_autotrader_allocation.cjs
      - run: python quant-autotrade/local_bot/test_live_sizing.py
