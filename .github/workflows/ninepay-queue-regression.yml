name: 9Pay queue regression
on:
  pull_request:
    paths:
      - 'scripts/cloud-vm/kiwoom_9pay_live.py'
      - 'scripts/cloud-vm/kiwoom_9pay_observer.py'
      - 'scripts/cloud-vm/kiwoom_ws_hub.py'
      - 'test/test_kiwoom_9pay_queue.py'
      - '.github/workflows/ninepay-queue-regression.yml'
  push:
    branches: [master]
    paths:
      - 'scripts/cloud-vm/kiwoom_9pay_live.py'
      - 'scripts/cloud-vm/kiwoom_9pay_observer.py'
      - 'scripts/cloud-vm/kiwoom_ws_hub.py'
      - 'test/test_kiwoom_9pay_queue.py'
      - '.github/workflows/ninepay-queue-regression.yml'
permissions:
  contents: read
jobs:
  queue-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest
      - run: python -m compileall -q scripts/cloud-vm/kiwoom_9pay_live.py test/test_kiwoom_9pay_queue.py
      - run: python -m pytest -q test/test_kiwoom_9pay_queue.py
