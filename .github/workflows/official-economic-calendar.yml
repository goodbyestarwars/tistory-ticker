name: Refresh official economic calendar

on:
  workflow_dispatch:
  schedule:
    # KST: 06:18, 10:18, 11:18, 12:18, 13:18, 15:18, 18:18, 22:18.
    # Poll after major Korean releases, with repeated chances for late source updates.
    - cron: '18 1,2,3,4,6,9,13,21 * * *'
  push:
    branches: [master]
    paths:
      - 'scripts/build_official_economic_calendar.py'
      - 'test/test_official_economic_calendar.py'
      - '.github/workflows/official-economic-calendar.yml'

permissions:
  contents: write
  pages: write

concurrency:
  group: official-economic-calendar
  cancel-in-progress: false

jobs:
  calendar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install schedule parsing dependencies
        run: python -m pip install 'beautifulsoup4>=4.12,<5' 'pypdf>=5,<7'
      - name: Check parsers and calendar integration
        run: |
          python -m unittest discover -s test -p test_official_economic_calendar.py
          node --test test/test_us_econ_calendar.js test/test_calendar_market_tabs.js
      - name: Refresh and publish public schedule metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          for attempt in 1 2 3; do
            git pull --ff-only origin master
            python scripts/build_official_economic_calendar.py
            git add data/official-economic-calendar.js
            if git diff --cached --quiet; then break; fi
            git commit -m "data(calendar): refresh official schedules"
            if git push origin HEAD:master; then break; fi
            if [ "$attempt" = 3 ]; then exit 1; fi
            git fetch origin master
            git reset --hard origin/master
          done
          # The legacy branch-based Pages build is not triggered by a GITHUB_TOKEN push.
          head=$(git rev-parse HEAD)
          built=$(gh api "repos/$GITHUB_REPOSITORY/pages/builds/latest" --jq .commit)
          if [ "$head" != "$built" ]; then
            gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds"
          fi
