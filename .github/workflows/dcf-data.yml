name: DCF annual disclosure archives
on:
  workflow_dispatch:
    inputs:
      codes:
        description: 'Stock codes (comma-separated), blank continues bounded master cursor'
        default: ''
      force:
        description: 'Refresh even if under 30 days old'
        type: boolean
        default: false
      max_calls:
        description: 'Per-run API budget; daily archive cap remains 12000'
        default: '1200'
  schedule:
    - cron: '17,47 * * * *' # Resumable full-universe backfill, then 30-day refresh; no VM.
permissions:
  contents: write
  pages: write
concurrency:
  group: dcf-annual-archives
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check key without exposing it
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: test -n "$DART_API_KEY" || { echo 'Register DART_API_KEY in Actions secrets to collect real disclosures.'; exit 1; }
      - uses: actions/cache@v4
        with:
          path: work/dart_corp_code_map.json
          key: dcf-corp-map-${{ github.run_id }}
          restore-keys: dcf-corp-map-
      - name: Collect bounded annual reports outside VM
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          DCF_CODES: ${{ inputs.codes }}
          DCF_FORCE: ${{ inputs.force }}
          DCF_MAX_CALLS: ${{ inputs.max_calls || '1200' }}
        run: |
          flags=()
          if [ "$DCF_FORCE" = "true" ]; then flags+=(--force); fi
          python scripts/build_dcf_data.py --codes "$DCF_CODES" --max-calls "$DCF_MAX_CALLS" --max-seconds 1500 --daily-calls 12000 --refresh-markets "${flags[@]}"
      - name: Validate generated archives
        run: python -m unittest discover -s test -p test_dcf_normalize.py
      - name: Publish static files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add dcf-data/
          if git diff --cached --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "Refresh DCF annual disclosure archives"
          git pull --rebase origin master
          git push origin HEAD:master
          gh api --method POST repos/${{ github.repository }}/pages/builds
