name: Shared HTTP and nightly scan regression
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'js/**'
      - 'css/**'
      - 'style.css'
      - 'scripts/cloud-vm/daily_scan.py'
      - 'scripts/cloud-vm/scan_inputs.py'
      - 'scripts/cloud-vm/scan_prereq.py'
      - 'scripts/cloud-vm/kiwoom_market.py'
      - 'scripts/cloud-vm/scheduled_job.py'
      - 'scripts/cloud-vm/market_calendar.py'
      - 'scripts/cloud-vm/main.py'
      - 'scripts/cloud-vm/calendar_*.py'
      - 'scripts/cloud-vm/earnings_calendar.py'
      - 'scripts/cloud-vm/sp500_constituents.py'
      - 'scripts/cloud-vm/db_schema.py'
      - 'scripts/cloud-vm/setup_*_timer.sh'
      - 'scripts/cloud-vm/deploy_check.sh'
      - 'test/**'
      - '.github/workflows/shared-foundation-regression.yml'
permissions:
  contents: read
concurrency:
  group: shared-foundation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install the existing pattern-engine test dependencies
        run: python -m pip install 'numpy<3' 'pandas<3' 'websockets>=14,<17'
      - name: Scan freshness, fallback, changed rows, timing and Linux cache locks
        env:
          PYTHONPATH: scripts/cloud-vm:test
        run: python -m unittest test_scan_inputs test_scan_prereq test_daily_scan_timings test_kiwoom_market test_scan_holiday_skip test_daily_scan_cache test_foreign_flow_timeouts test_scheduled_job test_scan_timer_schedule test_schedule_health test_strategy_public_contract test_snapshot_io test_fundamentals_disclosure test_earnings_growth_strategy
      - name: HTTP lifecycle and common chart engine
        run: |
          PYTHONPATH=scripts/cloud-vm:test python -m unittest test_calendar_unified test_earnings_calendar test_earnings_calendar_response test_calendar_completed_cards
          node --test test/test_calendar_market_tabs.js test/test_calendar_economic_results.js
          PYTHONPATH=scripts/cloud-vm:test python -m unittest test_scan_progress
          PYTHONPATH=scripts/cloud-vm:test python -m unittest test_toss_ws_hub test_realtime_quotes test_kis_ws_hub test_kiwoom_ws_hub
          node test/test_scanner_progress.js
          node test/test_http_client.js
          node test/test_shared_ui_api.js
          node test/test_home_market_contract.js
          python test/test_common_spacing.py
          python test/test_watchlist_readonly.py
          node test/test_watchlist_loading.js
          node test/test_home_countdown_scope.js
          node test/test_home_countdown_restore.js
          node test/test_weekend_countdown_window.js
          node test/test_home_toolbar_preservation.js
          node test/test_crypto_shared_quotes.js
          node test/test_binance_shared_quotes.js
          node test/test_weekend_calendar_rest.js
          node test/test_closed_countdown.js
          node test/test_weekend_binance.js
          node test/test_weekend_commodities.js
          node test/test_weekend_native_content.js
          node test/test_early_bootstrap.js
          node test/test_home_first_paint.js
          node test/test_chart_core.js
          node test/test_chart_smooth_wheel.js
          node test/test_chart_interactions.js
          node test/test_mobile_market.js
          node test/test_scanner_progress.js
          node test/test_scanner_dashboard.js
          node test/test_scanner_loading.js
          node test/test_scanner_groups.js
      - name: Page consumer refresh and partial failure behavior
        run: |
          node test/test_market_temp_ai_comments.js
          node test/test_market_temp_indicators.js
          node test/test_market_temp_briefing.js
          node test/test_market_temp_checkpoint.js
          node test/test_market_temp_refresh.js
          node test/test_sector_card_loading.js
      - name: JavaScript syntax and whitespace
        run: |
          for file in js/*.js; do node --check "$file"; done
          git diff --check HEAD^ HEAD
  calendar-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install isolated calendar browser test runtime
        run: |
          npm install --prefix "$RUNNER_TEMP/calendar-browser" --no-save playwright
          "$RUNNER_TEMP/calendar-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Calendar desktop and mobile interactions
        env:
          NINEPAY_QA_CHANNEL: chromium
          NINEPAY_CALENDAR_QA_DIR: calendar-browser-results
        run: NODE_PATH="$RUNNER_TEMP/calendar-browser/node_modules" node test/qa_calendar_unified.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: calendar-browser-results
          path: calendar-browser-results/
