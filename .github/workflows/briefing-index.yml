name: Update public market briefing search index

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - scripts/build_briefing_index.py
      - .github/workflows/briefing-index.yml
  schedule:
    # KST 03:35 daily. No resident process, no VM load.
    - cron: '35 18 * * *'

permissions:
  contents: write

concurrency:
  group: market-briefing-index
  cancel-in-progress: false

jobs:
  index:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate parser on known skin sample
        run: python -m unittest discover -s test -p 'test_briefing_index.py'
      - name: Validate front-end JavaScript
        run: |
          node --check js/briefing-archive.js
          node --check js/skin-main.js
          node test/test_briefing_archive.js
      - name: Read Tistory public category and article pages
        run: python scripts/build_briefing_index.py
      - name: Publish only when source-backed index changed
        run: |
          cp data/briefing-index.js "$RUNNER_TEMP/briefing-index.js"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # 다른 master 배포가 동시에 진행돼도 생성 색인을 새 HEAD 위에 다시 올린다.
          # 단일 행 JSON에 git rebase를 하면 충돌하기 쉬우므로 사용하지 않는다.
          for attempt in 1 2 3; do
            git fetch origin master
            git reset --hard origin/master
            cp "$RUNNER_TEMP/briefing-index.js" data/briefing-index.js
            git add data/briefing-index.js
            if git diff --cached --quiet -- data/briefing-index.js; then
              echo "No index changes"
              exit 0
            fi
            git commit -m "data(briefing): refresh public archive search index"
            if git push origin HEAD:master; then
              echo "Published briefing index"
              exit 0
            fi
            sleep 3
          done
          echo "Index publication failed after retries" >&2
          exit 1
