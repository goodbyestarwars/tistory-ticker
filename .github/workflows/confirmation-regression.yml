name: Integrated confirmation and order isolation
on:
  pull_request:
    paths:
      - 'scripts/cloud-vm/**'
      - 'quant-autotrade/**'
      - 'js/pattern-scan.js'
      - 'js/scanner-*.js'
      - 'css/pattern-scan.css'
      - 'css/scanner-progress.css'
      - 'test/**'
      - '.github/workflows/confirmation-regression.yml'
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install pytest numpy pandas requests python-dotenv websockets fastapi httpx anyio
      - name: Confirmation, coverage, patterns and mock orders
        run: >-
          python -m pytest -q test/test_signal_review.py test/test_quote_receipts.py
          test/test_pattern_detect.py test/test_pattern_tracker.py test/test_scan_inputs.py
          test/test_daily_scan_cache.py test/test_daily_scan_timings.py
          test/test_angle_momentum_scan.py test/test_angle_momentum_detect.py
          test/test_gongpasan_scan.py test/test_gongpasan_stages.py test/test_gongpasan_strategy.py
          test/test_kiwoom_ws_hub.py test/test_toss_ws_hub.py test/test_kis_ws_hub.py
          test/test_ninepay_feed_reliability.py test/test_kiwoom_9pay_observer.py
          test/test_kiwoom_9pay_queue.py quant-autotrade/local_bot/test_entry_priority.py
          quant-autotrade/local_bot/test_ninepay_runner.py
          quant-autotrade/local_bot/test_ninepay_signal_client.py
          quant-autotrade/local_bot/test_ninepay_trade.py
          quant-autotrade/local_bot/test_live_exclusion.py
      - name: Home cumulative turnover and volume participation
        run: |
          python -m pytest -q test/test_domestic_turnover.py test/test_us_market_breadth.py
          node test/test_market_participation.js
          node test/test_market_participation_bars.js
      - name: UI data contracts and defaults
        run: |
          node test/test_confirmation_ui.cjs
          node test/test_scanner_groups.js
          node test/test_scanner_two_stage.cjs
          node test/test_scanner_loading.js
          node test/test_scanner_dashboard.js
          node test/test_scanner_progress.js
          node test/test_scanner_public_states.cjs
          python -m pytest -q test/test_scanner_security_data.py test/test_public_scan_routes.py
