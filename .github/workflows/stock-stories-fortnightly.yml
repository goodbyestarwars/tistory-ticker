name: Stock stories (every two weeks, Sunday KST)

on:
  workflow_dispatch:
  schedule:
    - cron: '0 1 * * 0' # Every Sunday 10:00 KST; cadence gate below runs once per 14 days.

permissions:
  contents: write
  pages: write

concurrency:
  group: fortnightly-stock-stories
  cancel-in-progress: false

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Check fortnightly Sunday cadence (anchor 2026-11-08 KST)
        id: cadence
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python - <<'PY'
          import os
          from datetime import date, datetime, timedelta, timezone
          today = datetime.now(timezone(timedelta(hours=9))).date()
          anchor = date(2026, 11, 8)
          due = os.environ['EVENT_NAME'] == 'workflow_dispatch' or (
              today.weekday() == 6 and today >= anchor and (today - anchor).days % 14 == 0
          )
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as f:
              f.write('due=' + str(due).lower() + '\n')
          print('KST date:', today, '| refresh due:', due)
          PY

      - uses: actions/checkout@v4
        if: steps.cadence.outputs.due == 'true'
        with:
          ref: master
          persist-credentials: true
      - uses: actions/setup-python@v5
        if: steps.cadence.outputs.due == 'true'
        with:
          python-version: '3.12'

      - name: Check read-only Kiwoom credentials
        if: steps.cadence.outputs.due == 'true'
        env:
          KIWOOM_APPKEY: ${{ secrets.KIWOOM_APPKEY }}
          KIWOOM_SECRETKEY: ${{ secrets.KIWOOM_SECRETKEY }}
        run: |
          if [ -z "$KIWOOM_APPKEY" ] || [ -z "$KIWOOM_SECRETKEY" ]; then
            echo "::error::Repository Actions secrets KIWOOM_APPKEY and KIWOOM_SECRETKEY are required. No data was changed."
            exit 1
          fi

      - name: Regenerate read-only stock stories for the complete master
        if: steps.cadence.outputs.due == 'true'
        env:
          KIWOOM_APPKEY: ${{ secrets.KIWOOM_APPKEY }}
          KIWOOM_SECRETKEY: ${{ secrets.KIWOOM_SECRETKEY }}
        run: python scripts/build_stock_stories.py --all

      - name: Validate story snapshots before publication
        if: steps.cadence.outputs.due == 'true'
        run: |
          python test/test_build_stock_stories.py
          python test/test_stock_stories.py
          python - <<'PY'
          import json, re, subprocess
          from pathlib import Path

          def read_index(text):
              match = re.search(r'^window\.STOCK_STORY_INDEX=(\[.*\]);$', text, re.M)
              if not match:
                  raise ValueError('Missing stock-story index')
              return json.loads(match.group(1))

          previous = read_index(subprocess.check_output(
              ['git', 'show', 'HEAD:data/stock-stories.js'], text=True, encoding='utf-8'))
          current = read_index(Path('data/stock-stories.js').read_text(encoding='utf-8'))
          if len(current) < max(1, int(len(previous) * 0.85)):
              raise SystemExit('Card coverage unexpectedly dropped: %s -> %s' % (len(previous), len(current)))
          missing = [code for code in current if not (Path('data/stories') / (code + '.js')).is_file()]
          if missing:
              raise SystemExit('Missing per-stock stories: ' + ','.join(missing[:10]))
          print('Validated: %d -> %d auto story stocks, %d missing shards' % (
              len(previous), len(current), len(missing)))
          PY

      - name: Publish only validated changed story assets
        if: steps.cadence.outputs.due == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          git add data/stock-stories.js data/stories/
          if git diff --cached --quiet; then
            echo "No story changes; publish skipped."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "Refresh fortnightly stock story snapshots"
          git pull --rebase origin master
          git push origin HEAD:master
          # A GITHUB_TOKEN push does not automatically trigger the legacy Pages build.
          gh api --method POST repos/${{ github.repository }}/pages/builds
