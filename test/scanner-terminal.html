</head><body><main class="page"><h1>검색기</h1><p class="fixture-note">로컬 화면 검증 전용 · 합성 종목/가격이며 실제 검색 결과나 주문이 아닙니다.</p><div id="pattern-scan"></div><pre id="qa-results"></pre></main>

<script>
var mode=new URLSearchParams(location.search).get('mode')||'active', now=Date.now()/1000;
var fixtureRow={code:'005930',name:'삼성전자',price:71000,changeRate:2.1,at:now-2,sampleAt:now-3,volumeRatio:.82,first70At:now-240,priority80:true,stage:'signaled',branches:['A','B'],signalAt:now-30,signalPrice:70800};
var fixture={ruleVersion:mode==='legacy'?'old':'ab70-v1',running:true,active:mode!=='closed',rankAt:new Date().toISOString(),items:[fixtureRow],signals:[fixtureRow]};
if(mode==='delayed'){fixtureRow.at=fixtureRow.sampleAt=now-300;fixture.rankAt=new Date((now-300)*1000).toISOString();}
if(mode==='partial')fixture.rankError='합성 순위 장애';
var base={code:'005930',name:'삼성전자',price:70000,changeRate:1,date:'2026-10-16',score:80,reasons:['합성 근거'],interpretation:'검증용',miniChart:Array.from({length:20},(_,i)=>({date:'2026-10-'+String(i+1).padStart(2,'0'),close:69000+i*100})),patternDetail:{status:'BREAKOUT_NEW',resistance:72000}};
var patterns={};['risingLows','shortTermMaBreakout','maCloudBreakout','doubleBottom','invHeadShoulders','boxRangeLow','pullback','firstPullbackBreakout','angleMomentum','gongpasan','openingGap'].forEach(k=>patterns[k]=[JSON.parse(JSON.stringify(base))]);
patterns.volumeBreakout=[Object.assign({},base,{patternDetail:{live:true,signals:[{type:'EARLY_PACE',status:'early'},{type:'REALTIME_ACCUM',status:'confirmed'},{type:'OLD_BAR_REBREAK',stage:'REBREAK'}]}})];
patterns.longTermQuality=[Object.assign({},base,{financialScreen:{passed:true,annual:{year:2025,roe_pct:12,debt_ratio_pct:50,operating_income_yoy_pct:20,net_income_yoy_pct:15},latest_quarter:{year:2026,reprt_code:'11012',operating_income:1000000000,net_income:800000000},filing:{rcept_dt:'20260814'},checked_at:'2026-10-19'}})];
var filter={version:1,technical:4,passed:1,excluded:3,reasonCounts:{ANNUAL_LOSS:1,FINANCIAL_MISSING:1,DISCLOSURE_STALE:1},reasonLabels:{ANNUAL_LOSS:'연간 적자',FINANCIAL_MISSING:'재무자료 누락',DISCLOSURE_STALE:'최신 공시 확인 만료'}};
if(['missing','stale','loss'].includes(mode)){patterns.longTermQuality=[];filter.passed=0;filter.excluded=4;}
var scan={patterns:patterns,longTermFilter:filter,scannedAt:'2026-10-19T11:10:00Z',firstPullbackBreakoutReady:true,gongpasanStages:{status:'ok',stages:{WATCH_ACCUM:[JSON.parse(JSON.stringify(base))],BREAKOUT:[JSON.parse(JSON.stringify(base))],WAIT_PULLBACK:[JSON.parse(JSON.stringify(base))]}}};
/* 터미널 검증용 합성 선정 결과(관찰 전용, 주문 권한 없음) */
var shapeItem=Object.assign({},base,{price:70100,patternDetail:Object.assign({},base.patternDetail,{selectionVersion:'shape-selection-v1',orderAuthorized:false,observationOnly:true,support:68000,resistance:76000})});
scan.shapeSelection={version:'shape-selection-v1',mode:'observation',orderAuthorized:false,status:'ok',scannedAt:'2026-11-26T11:30:00Z',dataDate:'2026-11-26',coverage:{universe:100,eligible:10,skipped:90},groups:{},
 monitor:{scanners:{'pattern:shape-v2:bottomFormation':{all:{signals:120,since:'2026-11-20',rules:{'exit-v2':{closed:130,pf:1.5,avgPct:1.4,winPct:55,open:4,openAvgPct:0.8}}}},'pattern:shape-v2:pullbackRebreak':{all:{signals:30,rules:{'exit-v2':{closed:20,pf:0.8,avgPct:-1.1,winPct:40,open:3}}}}}}};
['liveFlow','trendBreakout','bottomFormation','pullbackRebreak','longTermQuality','leaderPullback'].forEach(function(k){scan.shapeSelection.groups[k]=[shapeItem,Object.assign({},shapeItem,{code:'000660',name:'관찰 합성',price:70000}),Object.assign({},shapeItem,{code:'035420',name:'연구 합성',price:70000})].map(function(it){return JSON.parse(JSON.stringify(it));});});
window.qaRequests=[];window.qaErrors=[];window.addEventListener('error',e=>{if(e.message)qaErrors.push(e.message)});
window.fetch=function(url){var u=String(url);qaRequests.push(u);if(mode==='error'&&u.includes('/health/realtime'))return Promise.reject(Error('합성 API 오류'));
var surgeItems=patterns.volumeBreakout.map(r=>Object.assign({},r,{lastObservedAt:mode==='delayed'?now-300:now-2}));
var data=u.includes('/health/realtime')?{ninePayResearch:fixture}:u.includes('/pattern-scan')?scan:u.includes('/volume-surge-live')?{active:true,dataBasis:{realtime:!['partial','delayed'].includes(mode)},error:mode==='partial'?'합성 KIS 부분 장애':null,items:surgeItems}:u.includes('/pattern-tracks')?{tracks:[],stats:{total:3,active:1,success:1,failed:1,days:90}}:{hits:[],tracks:[],items:[],daily:[]};
return Promise.resolve({ok:true,json:()=>Promise.resolve({success:true,data:data})});};
</script><script src="../js/skin-shell.js"></script><script>
window.NineAsset=window.NineAsset||{base:'../'};
(function(){var real=window.NineAPI||{};window.NineAPI=Object.assign({},real,{vmUrl:real.vmUrl||'',data:function(u){window.qaRequests.push(u);return Promise.resolve({received:true,vm:{flags:{liveTrading:false,manualStop:false,ninepayLive:false,leaderPullback:{on:false}}}});}});})();
</script><script src="../js/pattern-scan.js"></script><script src="../data/scanner-validation.js"></script><script src="../js/scanner-terminal.js"></script></body></html>
