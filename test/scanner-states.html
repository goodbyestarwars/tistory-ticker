<script>
const RealDate=Date; const fixedNow=RealDate.parse('2026-10-28T01:00:00Z'); window.Date=class extends RealDate { constructor(...args){super(...(args.length?args:[fixedNow]));} static now(){return fixedNow;} };
var mode=new URLSearchParams(location.search).get('mode')||'active', now=Date.now()/1000;
var fixtureRow={code:'005930',name:'삼성전자',price:70900,changeRate:2.1,at:now-2,sampleAt:now-3,volumeRatio:.82,first70At:now-240,priority80:true,stage:'signaled',branches:['A','B'],signalAt:now-3,signalPrice:70800,pullbackLow:70000,volumeMissing:false,excluded:null,ruleVersion:'ab70-v1',source:'Kiwoom WebSocket',signalId:'2026-10-28:005930'};
var fixture={ruleVersion:mode==='legacy'?'old':'ab70-v1',running:true,active:mode!=='closed',lastEventAt:new Date().toISOString(),rankAt:new Date().toISOString(),items:[fixtureRow],signals:[fixtureRow]};
if(mode==='delayed'){fixtureRow.at=fixtureRow.sampleAt=now-300;fixture.rankAt=new Date((now-300)*1000).toISOString();}
if(mode==='partial')fixture.rankError='합성 순위 장애';
var base={code:'005930',name:'삼성전자',price:70000,changeRate:1,date:'2026-10-16',score:80,reasons:['합성 근거'],interpretation:'검증용',miniChart:Array.from({length:20},(_,i)=>({date:'2026-10-'+String(i+1).padStart(2,'0'),close:69000+i*100})),scannedAt:'2026-10-28T00:00:00Z',signalReview:{version:'confirmation-shadow-v1',mode:'shadow',orderAuthorized:false,confirmed:true,entryValid:false,confirmedAt:'2026-10-28T00:00:00Z',evaluatedAt:'2026-10-28T00:00:00Z',dataAsOf:'2026-10-27',signalPrice:70000,invalidationPrice:68000},patternDetail:{status:'BREAKOUT_NEW',resistance:72000}};
var patterns={};['risingLows','shortTermMaBreakout','maCloudBreakout','doubleBottom','invHeadShoulders','boxRangeLow','pullback','firstPullbackBreakout','angleMomentum','gongpasan','openingGap'].forEach(k=>patterns[k]=[JSON.parse(JSON.stringify(base))]);
patterns.volumeBreakout=[Object.assign({},base,{patternDetail:{live:true,signals:[{type:'EARLY_PACE',status:'early'},{type:'REALTIME_ACCUM',status:'confirmed'},{type:'OLD_BAR_REBREAK',stage:'REBREAK'}]}})];

if(['missing','stale','loss'].includes(mode)){patterns.longTermQuality=[];filter.passed=0;filter.excluded=4;}
var scan={patterns:patterns,longTermFilter:filter,scannedAt:'2026-10-28T00:00:00Z',firstPullbackBreakoutReady:true,gongpasanStages:{status:'ok',stages:{WATCH_ACCUM:[JSON.parse(JSON.stringify(base))],BREAKOUT:[JSON.parse(JSON.stringify(base))],WAIT_PULLBACK:[JSON.parse(JSON.stringify(base))]}}};
window.SCANNER_SECURITY_TYPES={spacCodes:['399999'],ordinaryCodes:['005930','377777']};
if(mode==='metadata')delete window.SCANNER_SECURITY_TYPES;
fixture.items.push(
Object.assign({},fixtureRow,{code:'000660',name:'관찰 합성',stage:'volume_met',signalAt:null}),
Object.assign({},fixtureRow,{code:'035420',name:'연구 합성',stage:'analysis',signalAt:null}),
Object.assign({},fixtureRow,{code:'051910',name:'제외 합성',excluded:'표시 조건 미충족'}),
Object.assign({},fixtureRow,{code:'006400',name:'만료 합성',stage:'invalidated',entryInvalid:true}),
Object.assign({},fixtureRow,{code:'399999',name:'공식 유형 스팩',stage:'watch',signalAt:null}),
Object.assign({},fixtureRow,{code:'388888',name:'합성제1호스팩',stage:'watch',signalAt:null}),
Object.assign({},fixtureRow,{code:'377777',name:'스팩트럼',stage:'watch',signalAt:null}));

if(mode==='missing')fixture.items.forEach(r=>{delete r.at;delete r.sampleAt;});
if(mode==='shadow'){fixtureRow.signalAt=null;fixtureRow.stage='analysis';fixtureRow.signalReview={version:'confirmation-shadow-v1',strategy:'short',mode:'shadow',orderAuthorized:false,confirmed:true,entryValid:true,confirmedAt:now-1,signalPrice:70800,invalidationPrice:70000,checks:{flow:true}};}
if(mode==='delayed')fixture.items.forEach(r=>r.at=r.sampleAt=now-300);
var scheduleState=['running','waiting','failed','holiday','unknown','stale'].includes(mode)?mode:'success';
var job={id:'dailyscan',progress:{processed:25,total:100,updatedAt:new Date((now-(mode==='stale'?600:2))*1000).toISOString()},lastExecution:{state:mode==='stale'?'running':scheduleState,finishedAt:new Date((now-30)*1000).toISOString(),startedAt:new Date((now-60)*1000).toISOString(),reason:scheduleState==='failed'?'합성 실행 오류':''}};
window.qaTimers=[];var realSetInterval=window.setInterval;window.setInterval=function(fn,ms){qaTimers.push({fn:fn,ms:ms});return realSetInterval(fn,ms);};
window.qaRequests=[];window.qaErrors=[];window.addEventListener('error',e=>{if(e.message)qaErrors.push(e.message)});
window.qaChartDelay=0;
window.qaDaily=Array.from({length:500},(_,i)=>{var date=new RealDate(fixedNow-(500-i)*86400000);return {date:date.toISOString().slice(0,10),open:70000+i*10,high:70900+i*10,low:69000+i*10,close:70200+i*10,volume:100000+i*100};}).filter(b=>![0,6].includes(new RealDate(b.date).getUTCDay()));

 var chart={daily:qaDaily.map(b=>Object.assign({},b)),detail:{status:'NECKLINE_READY',reasons:['합성 패턴 근거']}};
 return new Promise(resolve=>setTimeout(()=>resolve({ok:true,json:()=>Promise.resolve(u.includes('patternChart=1')?chart:{success:true,data:chart})}),qaChartDelay));
}
var surgeItems=patterns.volumeBreakout.map(r=>Object.assign({},r,{lastObservedAt:mode==='delayed'?now-300:now-2}));
var data=u.includes('/health/schedules')?{jobs:[job]}:u.includes('/health/realtime')?{ninePayResearch:fixture}:u.includes('/pattern-scan')?scan:u.includes('/volume-surge-live')?{active:true,dataBasis:{realtime:!['partial','delayed'].includes(mode)},error:mode==='partial'?'합성 KIS 부분 장애':null,items:surgeItems}:u.includes('/pattern-tracks')?{tracks:mode==='history'?[{id:1,code:'012345',name:'과거 성공 합성',scanner:'pattern:volumeBreakout',status:'SUCCESS',detected_date:'2026-10-20',detected_close:100,current_close:105},{id:2,code:'399999',name:'숨김 인수회사',status:'SUCCESS',detected_date:'2026-10-20',detected_close:100}]:[],stats:{total:3,active:1,success:1,failed:1,days:90}}:{hits:[],tracks:[],items:[],daily:[]};
return Promise.resolve({ok:true,json:()=>Promise.resolve({success:true,data:data})});};
