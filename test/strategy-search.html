<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>strategy-search 로컬 테스트</title>
<link rel="stylesheet" href="../css/strategy-search.css" />
<style>
  body { font-family: 'Nanum Myeongjo', Georgia, serif; margin: 0; background: #fff; }
  html.dark body { background: #1a1a1a; }
  .page-body { max-width: 900px; margin: 40px auto; padding: 0 16px; }
  .toggle-dark { margin-bottom: 16px; }
</style>
</head>
<body>

<div class="page-body">
  <h1>strategy-search 로컬 테스트</h1>
  <button class="toggle-dark" onclick="document.documentElement.classList.toggle('dark')">다크모드 토글</button>
  <p style="font-size:13px;color:#888">mock 데이터로 재무건전 장기 눌림·배당주·ETF·ETN 비교표, 조건 자세히, 누락값 대시, 구성종목 팝업, 클릭 이동을 확인합니다.</p>
  <div id="strategy-search"></div>
</div>

<script src="../js/strategy-search.js"></script>
<script>
  function match(code, name, price, rate, disparity, roe, debtRatio) {
    return {
      code: code, name: name, price: price, changeRate: rate, date: '2026-08-05',
      disparity: disparity, fundamentalScore: 72, roe: roe, debtRatio: debtRatio
    };
  }
  function dividendMatch(code, name, price, rate, yieldPct, dps, year) {
    return { code: code, name: name, price: price, changeRate: rate, date: '2026-08-05', strategy: 'dividend',
      dividendYieldPct: yieldPct, cashDividendPerShare: dps, payoutRatioPct: 42.5, roe: 11.4, per: 6.8, pbr: 0.72,
      dividendHistory: [{ year: year, dps: dps }, { year: year - 1, dps: dps - 200 }, { year: year - 2, dps: dps - 100 }, { year: year - 3, dps: dps - 50 }],
      market: code === '105560' ? 'KOSPI' : 'KOSDAQ', sector: code === '105560' ? '금융' : '통신서비스', dividendStatus: '실제', reportYear: year };
  }
  function targetPriceMatch(code, name, price, rate, targetPrice, roe, debtRatio) {
    return {
      code: code, name: name, price: price, changeRate: rate, date: '2026-08-05',
      strategy: 'targetPriceGap', targetPrice: targetPrice,
      targetGapPct: Math.round(((targetPrice - price) / price) * 1000) / 10,
      sectorPerAvg: 11.4, sectorPbrAvg: 1.2, fundamentalScore: 78, roe: roe, debtRatio: debtRatio,
    };
  }
  function etfMatch(code, name, price, rate, returns) {
    return { code: code, name: name, price: price, changeRate: rate, date: '2026-08-05', strategy: 'etfReturn',
      returnRate1mPct: returns[0], returnRate3mPct: returns[1], returnRate6mPct: returns[2], returnRate12mPct: returns[3],
      volume: 1234567, turnover: 9876543210, aum: 125000000000, provider: name.indexOf('KODEX') === 0 ? '삼성자산운용' : '미래에셋자산운용', majorCategory: '국내주식', middleCategory: '시장대표', leverageType: '일반' };
  }

  var mockCategories = {
    undervalued: {
      name: '저평가 종목',
      methodology: '펀더멘탈 점수(DART ROE·부채비율 기준) 60점 이상 + 120일 이동평균 대비 90% 이하로 가격이 눌린 종목만 후보로 삼고, 섹터별로 가장 많이 눌린 상위 5개만 보여줍니다. PER·PBR 같은 실제 밸류에이션 데이터가 없어 "장기 추세 대비 가격 눌림"으로 근사한 것이라 진짜 저평가(이익·자산 대비 싼 가격)와는 다를 수 있습니다.',
      sectors: {
        'IT': {
          name: 'IT',
          matches: [
            match('005930', '삼성전자', 68400, -1.2, 84.3, 12.1, 38.2),
            match('000660', 'SK하이닉스', 174500, 0.6, 88.7, 21.4, 55.0)
          ]
        },
        '금융': {
          name: '금융',
          matches: [
            match('105560', 'KB금융', 82600, -0.4, 86.1, 10.8, 120.5)
          ]
        },
        '산업재': { name: '산업재', matches: [] }
      }
    },
    dividend: {
      name: '배당주',
      methodology: 'DART 사업보고서 현금배당 공시를 기준으로 배당수익률과 주당 현금배당금을 비교합니다. 배당수익률은 과거 공시 기준이며 주가 하락·일회성 배당 여부는 별도 확인이 필요합니다.',
      sectors: {
        '금융': { name: '금융', matches: [dividendMatch('105560', 'KB금융', 82600, -0.4, 5.2, 4200, 2025)] },
        '통신서비스': { name: '통신서비스', matches: [dividendMatch('017670', 'SK텔레콤', 54200, 0.2, 4.7, 2500, 2025)] }
      }
    },
    etfReturn: {
      name: 'ETF 수익률 상위',
      methodology: '기간 수익률과 편입 구성을 비교하는 화면이며, 매수 의견이 아닙니다.',
      sectors: {
        ETF: { name: 'ETF', matches: [
          etfMatch('069500', 'KODEX 200', 42100, 0.8, [4.2, 7.8, 11.4, 18.6]),
          etfMatch('360750', 'TIGER 미국S&P500', 19800, -0.3, [3.1, 8.4, 15.2, 27.1])
        ] }
      }
    },
    etnReturn: {
      name: 'ETN',
      methodology: 'ETN 상품 mock 데이터입니다.',
      productKind: 'etn',
      sectors: {
        ETN: { name: 'ETN', matches: [
          { code: '550001', name: '삼성 레버리지 ETN', price: 10350, changeRate: 2.42, returnRate1mPct: 12.4, returnRate3mPct: 18.1, returnRate6mPct: 21.2, returnRate12mPct: 28.8, volume: 120000, turnover: 654000000, aum: 15000000000, provider: '삼성증권', leverageType: '레버리지', majorCategory: '국내주식', middleCategory: '레버리지' }
        ] }
      }
    },
    // 2026-08-22 신설, 2026-08-23 계산법 교체 - "목표주가 괴리 저평가주": 같은 업종 오늘
    // 평균 PER/PBR 대비 목표가가 현재가보다 20%+ 높은 종목만 표시(strategy_scan.py
    // scan_target_price_gap()). 과거 5개년 밴드 방식은 daily_prices 이력 부족으로
    // 폐기(항상 0건이었음) - docs/WORK_HISTORY.md 참고.
    targetPriceGap: {
      name: '목표주가 괴리 저평가주',
      methodology: '같은 업종(WICS 섹터) 내 다른 종목들의 오늘 PER·PBR 중앙값을 기준으로 현재가에서 35%만 부분수렴한 6~12개월 참고 목표주가를 계산합니다. 애널리스트 목표가보다 높아지면 70% 지점으로 낮추고, 괴리율 60% 초과 값은 제외합니다. 백테스트 전 참고용 근사치입니다.',
      sectors: {
        'IT': {
          name: 'IT',
          matches: [
            Object.assign(targetPriceMatch('035420', 'NAVER', 178000, 1.4, 245000, 15.0, 42.0),
              { analystTargetPrice: 245000, analystTargetGapPct: 37.6, targetPriceCappedByAnalyst: true }),
            targetPriceMatch('018260', '삼성에스디에스', 138000, -0.6, 172000, 9.8, 30.1)
          ]
        },
        '산업재': {
          name: '산업재',
          matches: [Object.assign(targetPriceMatch('012330', '현대모비스', 215000, 0.9, 280000, 8.4, 45.6),
            { analystTargetPrice: 310000, analystTargetGapPct: 44.2 })]
        }
      }
    }
  };

  StrategySearch.fetchJson = function (url) {
    console.log('[mock] fetch', url);
    if (url.indexOf('strategyScan=1') > -1) {
      return Promise.resolve({
        scannedAt: '2026-08-05T07:20:00Z',
        scanned: 2140,
        universe: 2913,
        skippedNoData: 300,
        skippedIlliquid: 420,
        skippedNoSector: 53,
        skippedNoFundamentals: 200,
        categories: mockCategories
      });
    }
    return Promise.resolve({});
  };
  window.__strategySearchFetch = function (url) {
    if (url.indexOf('etf-components/') > -1) {
      return Promise.resolve({ data: {
        price: 42100, changeRatePct: 0.8, nav: 42020, componentCount: 3, asOf: '2026-08-16',
        components: [
          { code: '005930', name: '삼성전자', weightPct: 34.8, price: 68400, changeRatePct: 1.2 },
          { code: '000660', name: 'SK하이닉스', weightPct: 20.4, price: 174500, changeRatePct: -0.6 },
          { code: '373220', name: 'LG에너지솔루션', weightPct: 9.6, price: 389000, changeRatePct: 0.1 }
        ]
      } });
    }
    return Promise.resolve({});
  };
</script>

</body>
</html>
