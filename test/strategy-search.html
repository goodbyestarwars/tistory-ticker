<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>strategy-search(저평가 종목) 로컬 테스트</title>
<link rel="stylesheet" href="../css/strategy-search.css" />
<style>
  body { font-family: 'Nanum Myeongjo', Georgia, serif; margin: 0; background: #fff; }
  html.dark body { background: #1a1a1a; }
  .page-body { max-width: 900px; margin: 40px auto; padding: 0 16px; }
  .toggle-dark { margin-bottom: 16px; }
</style>
</head>
<body>

<div class="page-body">
  <h1>strategy-search(저평가 종목) 로컬 테스트</h1>
  <button class="toggle-dark" onclick="document.documentElement.classList.toggle('dark')">다크모드 토글</button>
  <p style="font-size:13px;color:#888">mock 데이터로 섹터별 카드/행 + 판정 근거(이격도·ROE) 표시 + 클릭 이동을 확인. 실제 GAS/VM 호출은 배포 후 별도 확인.</p>
  <div id="strategy-search"></div>
</div>

<script src="../js/strategy-search.js"></script>
<script>
  function match(code, name, price, rate, disparity, roe, debtRatio) {
    return {
      code: code, name: name, price: price, changeRate: rate, date: '2026-08-05',
      disparity: disparity, fundamentalScore: 72, roe: roe, debtRatio: debtRatio
    };
  }

  var mockSectors = {
    'IT': {
      name: 'IT',
      matches: [
        match('005930', '삼성전자', 68400, -1.2, 84.3, 12.1, 38.2),
        match('000660', 'SK하이닉스', 174500, 0.6, 88.7, 21.4, 55.0)
      ]
    },
    '금융': {
      name: '금융',
      matches: [
        match('105560', 'KB금융', 82600, -0.4, 86.1, 10.8, 120.5)
      ]
    },
    '산업재': {
      name: '산업재',
      matches: []
    }
  };

  StrategySearch.fetchJson = function (url) {
    console.log('[mock] fetch', url);
    if (url.indexOf('strategyScan=1') > -1) {
      return Promise.resolve({
        scannedAt: '2026-08-05T07:20:00Z',
        scanned: 2140,
        universe: 2913,
        skippedNoData: 300,
        skippedIlliquid: 420,
        skippedNoSector: 53,
        skippedNoFundamentals: 200,
        methodology: '펀더멘탈 점수(DART ROE·부채비율 기준) 60점 이상 + 120일 이동평균 대비 90% 이하로 가격이 눌린 종목만 후보로 삼고, 섹터별로 가장 많이 눌린 상위 5개만 보여줍니다. PER·PBR 같은 실제 밸류에이션 데이터가 없어 "장기 추세 대비 가격 눌림"으로 근사한 것이라 진짜 저평가(이익·자산 대비 싼 가격)와는 다를 수 있습니다.',
        sectors: mockSectors
      });
    }
    return Promise.resolve({});
  };
</script>

</body>
</html>
