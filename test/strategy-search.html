<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>strategy-search 로컬 테스트</title>
<link rel="stylesheet" href="../css/strategy-search.css" />
<style>
  body { font-family: 'Nanum Myeongjo', Georgia, serif; margin: 0; background: #fff; }
  html.dark body { background: #1a1a1a; }
  .page-body { max-width: 900px; margin: 40px auto; padding: 0 16px; }
  .toggle-dark { margin-bottom: 16px; }
</style>
</head>
<body>

<div class="page-body">
  <h1>strategy-search 로컬 테스트</h1>
  <button class="toggle-dark" onclick="document.documentElement.classList.toggle('dark')">다크모드 토글</button>
  <p style="font-size:13px;color:#888">mock 데이터로 프리셋 탭 전환 + 카드/행 스타일 종목 리스트 + breakout_fail 경보 행 강조 + 클릭 이동을 확인. 실제 GAS/VM 호출은 배포 후 별도 확인.</p>
  <div id="strategy-search"></div>
</div>

<script src="../js/strategy-search.js"></script>
<script>
  function match(code, name, price, rate, matched, total) {
    return { code: code, name: name, price: price, changeRate: rate, date: '2026-08-05', confidence: matched / total, matched: matched, total: total };
  }

  var mockStrategies = {
    golden_cross: {
      name: '골든크로스', category: 'trend',
      description: '5일 이동평균선이 20일 이동평균선을 상향 돌파하면 매수',
      matches: [
        match('005930', '삼성전자', 78400, 1.8, 2, 2),
        match('000660', 'SK하이닉스', 214500, 3.2, 2, 2)
      ]
    },
    week52_high: {
      name: '52주 신고가', category: 'breakout',
      description: '종가가 직전 252거래일(약 52주) 고점을 새로 넘어서면 매수',
      matches: [
        match('373220', 'LG에너지솔루션', 452500, 2.9, 1, 1)
      ]
    },
    disparity: {
      name: '이격도', category: 'reversion',
      description: '종가가 20일 이동평균 대비 8% 넘게 아래로 벌어지면(과매도) 매수',
      matches: []
    },
    breakout_fail: {
      name: '돌파 실패', category: 'stop_loss',
      description: '직전 20일 고점을 넘봤다가 다시 그 아래로 밀리면 경보 - 매수 신호가 아니라 이탈 경보',
      matches: [
        match('096770', 'SK이노베이션', 128500, -2.1, 1, 1)
      ]
    }
  };

  StrategySearch.fetchJson = function (url) {
    console.log('[mock] fetch', url);
    if (url.indexOf('strategyScan=1') > -1) {
      return Promise.resolve({
        scannedAt: '2026-08-05T07:20:00Z',
        scanned: 3120,
        universe: 3913,
        skippedNoData: 210,
        skippedIlliquid: 583,
        strategies: mockStrategies
      });
    }
    return Promise.resolve({});
  };
</script>

</body>
</html>
