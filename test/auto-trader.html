<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>auto-trader 로컬 테스트</title>
<link rel="stylesheet" href="../css/ui-spacing.css" />
<link rel="stylesheet" href="../css/auto-trader.css" />
<style>
  body { font-family: system-ui, 'Pretendard', sans-serif; margin: 0; background: #fff; --np-paper: #fff; --home-content-max: 1440px; }
  html.dark { --np-ink: 241, 244, 248; --dk-up: #ff6b6b; --dk-down: #6ea8ff; }
  html.dark body { background: #1a1a1a; color: #eee; --np-paper: #1a1a1a; }
  .wrap { padding: 16px; }
</style>
</head>
<body>
<div class="wrap"><p style="font-size:12px;color:#888">시나리오: ?s=ok | stopped | stale | blocked | forbidden — 서버 제어 API(/autotrader/*) 응답을 흉내 낸 mock(주문·계좌·서비스 연결 없음)</p>
<div id="auto-trader"></div></div>
<script src="../js/skin-shell.js"></script>
<script>
  var scenario = (location.search.match(/s=([\w-]+)/) || [0, 'ok'])[1];
  window.T = { config: { IS_LOGIN: true, ROLE: 'owner' } };
  var vm = { capabilities: ['hold', 'target-buy-v1'], targetBuys: [{ code: '005930', name: '삼성전자', price: 190000, qty: 5, state: 'WAIT' }], timerState: 'enabled', serviceState: 'inactive', lastResult: { result: 'success', exitStatus: '0', at: 'Fri 2026-10-30 15:21:04 KST' },
    flags: { liveTrading: true, ninepayLive: true, liveSell: false, approval: { present: true, date: '2026-10-19' } },
    ledger: { unknownOrders: 0, openPositions: 1, todayOrders: 2 }, feed: { state: 'OK', reason: null }, runnerProcs: 0, tgConflict: false };
  var mockStatus = { configured: true, received: true, ageSec: 7, tradingDay: true, vm: vm, startBlockers: ['타이머가 이미 켜져 있음'], canStart: false, pending: null, lastCommand: null };
  if (scenario === 'stopped') { vm.timerState = 'disabled'; mockStatus.startBlockers = []; mockStatus.canStart = true; mockStatus.lastCommand = { action: 'stop', result: 'DONE', at: '2026-11-01T22:10:00+09:00', reason: '' }; }
  if (scenario === 'stale') { mockStatus.received = false; mockStatus.ageSec = 412; mockStatus.canStart = false; mockStatus.vm = { flags: null, ledger: null, feed: null, lastResult: null }; mockStatus.startBlockers = ['VM 상태 미수신(에이전트 응답 없음)']; }
  if (scenario === 'blocked') { vm.timerState = 'disabled'; vm.ledger.unknownOrders = 2; mockStatus.tradingDay = false; mockStatus.canStart = false; mockStatus.startBlockers = ['휴장일(주말·공휴일)', 'UNKNOWN 주문 2건']; }
  mockStatus.activity = { orders: [], candidates: { rows: [] }, positions: [
    { code: '005930', name: '삼성전자', qty: 64, avg: 200000, state: 'OPEN', buyDay: '2026-11-03' },
    { code: '035420', name: 'NAVER', qty: 82, avg: 207669, state: 'OPEN', buyDay: '2026-11-04' },
    { code: '042660', name: '한화오션', qty: 95, avg: 115311, state: 'OPEN', buyDay: '2026-10-21' },
    { code: '068270', name: '셀트리온', qty: 9, avg: 213000, state: 'OPEN', buyDay: '2026-11-05' },
    { code: '000000', name: '시세미수신', qty: 10, avg: 10000, state: 'OPEN', buyDay: '2026-11-06' }] };
  window.NineHttp = { json: function () { return Promise.resolve({}); } };
  window.NineAPI = { vmUrl: 'https://mock.invalid', data: function (url, opt) {
    var err = function (code) { var e = new Error('HTTP ' + code); e.status = code; return Promise.reject(e); };
    if (scenario === 'forbidden') return err(403);
    if (url.indexOf('/autotrader/command') >= 0) { window.lastCommand = JSON.parse(opt.fetchOptions.body); return Promise.resolve({ id: 'x', action: window.lastCommand.action }); }
    return Promise.resolve(mockStatus);
  }, domesticQuotes: function () {
    return Promise.resolve([{ code: '005930', price: 193400, changeRate: -4.02, quote_time: '2026-11-06T20:00:00+09:00' },
      { code: '035420', price: 188300, changeRate: 1.84 }, { code: '042660', price: 47650, changeRate: -3.25 }, { code: '068270', price: 208500, changeRate: -3.02 }]);
  } };
</script>
<script src="../js/auto-trader.js"></script>
</body>
</html>
