<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>공통 포인터 검증</title><link rel="stylesheet" href="../style.css"><style>body{display:block;padding:24px;margin:0}main{max-width:1400px;margin:auto}.test-general,.test-chart{min-height:90px;border:1px solid #ddd;margin:20px 0;padding:20px}.test-results{padding:16px;border:1px solid #bbb}.test-pass{color:#137333}.test-fail{color:#b3261e}</style></head><body id="tt-body-index"><main>
<h1>공통 포인터 검증</h1><p>실제 공통 모듈(site-interactions.js)로 누름 포인터·제외 영역·입력 유지를 확인하는 검증 화면이다. (2026-10-11 휴장 시장뉴스 구역 삭제로 뉴스 캐러셀 검증 부분은 제거했다.)</p>
<div class="test-general ff-chart-card de-chart-modal" tabindex="0">일반 정보 패널: chart·modal 클래스가 있어도 누른 채 이동하면 빨간 곡선이 나타난다.</div>
<div class="test-chart ss-chart" data-no-pointer-effect tabindex="0">차트 조작 제외 영역 <canvas width="100" height="20"></canvas></div>
<label>입력 확인 <input id="test-input" value="텍스트 선택과 입력은 유지"></label>
<div id="test-results" class="test-results" aria-live="polite">검증 중...</div>
</main><script src="../js/site-interactions.js"></script><script>
(function () {
  var api = window.SiteInteractions;
  var general = document.querySelector('.test-general');
  var chart = document.querySelector('.test-chart');
  var input = document.querySelector('#test-input');
  var results = [
    ['chart·modal 이름의 일반 패널 허용', !api.isExcluded(general)],
    ['실제 차트 조작 영역 제외', api.isExcluded(chart)],
    ['입력 영역 제외', api.isExcluded(input)],
    ['페이지당 포인터 SVG 1개', document.querySelectorAll('[data-site-pointer]').length === 1]
  ];
  var box = document.querySelector('#test-results');
  box.innerHTML = results.map(function (item) {
    return '<div class="' + (item[1] ? 'test-pass' : 'test-fail') + '">' + (item[1] ? '통과' : '실패') + ' · ' + item[0] + '</div>';
  }).join('');
}());
</script>
</body></html>
