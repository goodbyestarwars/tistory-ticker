<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>마켓브리핑 공유 버튼 검수</title>
  <link rel="stylesheet" href="../style.css">
  <style>
    body { margin: 0; background: #f7f8f5; }
    .fixture { max-width: 980px; margin: 28px auto; padding: 0 16px; }
    .fixture h1 { margin-bottom: 18px; font-size: 20px; }
  </style>
</head>
<body>
<main class="fixture">
  <h1>마켓브리핑 카드별 공유 버튼</h1>
  <div class="feed">
    <article class="post-card feed-featured" data-url="#featured">
      <div class="post-header"><span class="post-date">2026. 8. 16.</span></div>
      <a href="#featured"><div class="post-title">대표형 마켓브리핑</div></a>
      <div class="post-excerpt">대표 카드에서도 공유 버튼이 항상 보입니다.</div>
      <div class="post-footer"><div class="post-footer-left"></div><div class="post-footer-right"><button class="btn-share">공유</button><button class="btn-read">더 보기 →</button></div></div>
    </article>

    <div class="feed-block feed-block-hero">
      <div class="feed-hero-featured-slot">
        <article class="post-card feed-featured" data-url="#hero">
          <div class="post-header"><span class="post-date">2026. 8. 15.</span></div>
          <a href="#hero"><div class="post-title">히어로 대표 브리핑</div></a>
          <div class="post-excerpt">넓은 카드의 공유와 더 보기를 함께 확인합니다.</div>
          <div class="post-footer"><div class="post-footer-left"></div><div class="post-footer-right"><button class="btn-share">공유</button><button class="btn-read">더 보기 →</button></div></div>
        </article>
      </div>
      <div class="feed-block-headline">
        <article class="post-card feed-headline-item" data-url="#headline">
          <div class="post-header"><span class="post-date">2026. 8. 14.</span></div>
          <a href="#headline"><div class="post-title">제목형 브리핑도 작은 공유 버튼을 유지합니다</div></a>
          <div class="post-excerpt">제목형 설명</div>
          <div class="post-footer"><div class="post-footer-left"></div><div class="post-footer-right"><button class="btn-share">공유</button><button class="btn-read">더 보기 →</button></div></div>
        </article>
      </div>
    </div>

    <div class="feed-block feed-block-duo">
      <article class="post-card feed-duo-item" data-url="#duo-a">
        <div class="post-header"><span class="post-date">2026. 8. 13.</span></div>
        <a href="#duo-a"><div class="post-title">2열 브리핑 A</div></a>
        <div class="post-excerpt">2열 카드에도 공유가 표시됩니다.</div>
        <div class="post-footer"><div class="post-footer-left"></div><div class="post-footer-right"><button class="btn-share">공유</button><button class="btn-read">더 보기 →</button></div></div>
      </article>
      <article class="post-card feed-duo-item" data-url="#duo-b">
        <div class="post-header"><span class="post-date">2026. 8. 12.</span></div>
        <a href="#duo-b"><div class="post-title">2열 브리핑 B</div></a>
        <div class="post-excerpt">카드 배치와 관계없이 같은 액션을 제공합니다.</div>
        <div class="post-footer"><div class="post-footer-left"></div><div class="post-footer-right"><button class="btn-share">공유</button><button class="btn-read">더 보기 →</button></div></div>
      </article>
    </div>
  </div>
</main>
</body>
</html>
