<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>시장지표 > 환율 탭 로컬 테스트</title>
<!-- 운영 공통 스타일(@layer np 포함)을 그대로 불러와 새 CSS와 충돌하는지 본다. -->
<link rel="stylesheet" href="https://goodbyestarwars.github.io/tistory-ticker/style.css" />
<link rel="stylesheet" href="../css/market-indicators.css" />
<link rel="stylesheet" href="../css/fx-rates.css" />
<style>
  body { margin: 0; }
  .page-body { max-width: 1100px; margin: 24px auto; padding: 0 16px; }
  .tools { margin: 0 0 14px; display: flex; gap: 8px; flex-wrap: wrap; font: 12px sans-serif; }
  .tools button { padding: 4px 10px; cursor: pointer; }
</style>
</head>
<body>
<div class="page-body">
  <div class="tools">
    <button type="button" onclick="document.documentElement.classList.toggle('dark')">다크모드 토글</button>
    <span>API: <code id="api"></code> (기본 로컬 미리보기 API, <code>?api=https://goodbyestar.cloud</code> 로 운영 값 확인 - CORS 때문에 라이브 페이지에서만 성공)</span>
  </div>
  <div class="mi-wrap">
    <div class="mi-tabs" role="tablist"><button class="mi-tab">국내 시장지표</button><button class="mi-tab">글로벌 시장지표</button><button class="mi-tab">주요 미국 발표</button><button class="mi-tab">가상자산</button><button class="mi-tab active">환율</button></div>
    <div class="mi-panel"><div id="fx-rates"></div></div>
  </div>
</div>
<script>
  var api = new URLSearchParams(location.search).get('api') || 'http://127.0.0.1:8099';
  window.FX_RATES_API_BASE = api;
  document.getElementById('api').textContent = api;
</script>
<script src="../js/fx-rates.js"></script>
</body>
</html>
