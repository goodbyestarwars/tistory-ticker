# 9Pay 보안 응답 헤더 (2026-11-07 모의진단 M1/L1). 기존 HTTPS server {} 블록 안에 include.
# 적용은 VM에서 수동(nginx -t 후 reload).
add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "no-referrer" always;
# CSP는 /kis-tool/ 화면(포트 18870)이 같은 server 블록에 있어 넣지 않는다.

# http {} 블록(전역)에 한 줄: server_tokens off;
# 80포트 server 블록은 아래처럼 HTTPS로 리다이렉트:
#   server { listen 80; server_name goodbyestar.cloud; return 301 https://$host$request_uri; }
# 주의: /ws/* 웹소켓과 OAuth 콜백 경로를 건드리지 않는다. add_header는 location 안에
# 별도 add_header가 있으면 상속되지 않으므로 적용 후 curl -I로 확인한다.
