# 9Pay / Tancheon dog: put this INCLUDE INSIDE the existing HTTPS server {} block.
# Install the repo's 404.html as /var/www/9pay-errors/404.html first.
# All Nginx-generated errors listed below render the SAME local, self-contained page.
# Without "=", the original HTTP error status (404/502/503/etc.) is preserved.
error_page 400 403 404 405 408 410 413 414 415 418 422 429 431 451
           500 501 502 503 504 505 507 508 510 511 /__9pay_error_page;

location = /__9pay_error_page {
    internal;
    alias /var/www/9pay-errors/404.html;
    default_type text/html;
    add_header Cache-Control "no-store" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
}

# Leave proxy_intercept_errors OFF in upstream API locations.
# Do not redirect to an external URL: that would change original error responses.
