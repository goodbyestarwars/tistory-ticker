<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KIS Trading Tool · 9Pay</title>
<link rel="stylesheet" href="https://goodbyestarwars.github.io/tistory-ticker/css/legal.css"><link rel="stylesheet" href="https://goodbyestarwars.github.io/tistory-ticker/css/ui-system.css"><link rel="stylesheet" href="https://goodbyestarwars.github.io/tistory-ticker/css/kis-tool.css"></head>
<body style="margin:0;max-width:none;padding:0">
<div class="kis-shell">
  <aside class="kis-side">
    <div><h1 class="kis-brand">KIS Trading Tool</h1><span class="kis-chip">백데이터 · 주문 차단</span></div>
    <nav class="kis-nav" id="nav" aria-label="KIS 도구"></nav>
    <a class="kis-back" href="https://ghlee.tistory.com/">블로그로 돌아가기</a>
  </aside>
  <main class="kis-main">
    <p class="kis-note">과거 데이터 분석 전용 · 종목마다 데이터 보유 기간이 다릅니다.</p>
    <iframe id="ws" name="kis-workspace" title="KIS 과거 데이터 분석"></iframe>
  </main>
</div>
<script>
/* 메뉴 추가는 이 배열에 한 줄만 */
var MENU=[
 {g:'',id:'builder',t:'전략 빌더',src:'/kis-tool/builder/builder'}
];
var nav=document.getElementById('nav'),ws=document.getElementById('ws');
function render(){
  var cur=(location.hash||'#builder').slice(1);if(!MENU.some(function(m){return m.id===cur}))cur='builder';
  nav.textContent='';var last='',box;
  MENU.forEach(function(m){
    if(!box||m.g!==last){box=document.createElement('div');box.className='kis-group';var h=document.createElement('h2');h.textContent=m.g;if(m.g)box.appendChild(h);nav.appendChild(box);last=m.g}
    var a=document.createElement('a');a.href='#'+m.id;a.textContent=m.t;if(m.id===cur){a.setAttribute('aria-current','page');if(ws.getAttribute('src')!==m.src)ws.src=m.src}
    box.appendChild(a);
  });
}
addEventListener('hashchange',render);render();
</script></body></html>
