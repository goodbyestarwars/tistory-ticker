version: "1.0"

metadata:
  name: "돌파 실패"
  description: "직전 20일 고점을 넘봤다가 다시 그 아래로 밀리면(돌파 실패) 경보 - 신규 매수가 아니라 보유 종목의 손절/회피 신호로 쓰는 프리셋"
  author: "9Pay"
  tags: [breakout-fail, stop-loss, resistance]

strategy:
  id: breakout_fail
  category: stop_loss

  indicators:
    # exclude_current: true - 오늘을 뺀 직전 20일 고점(=전고점/저항선).
    - id: highest
      alias: resistance
      params:
        period: 20
        field: high
        exclude_current: true
    - id: price
      alias: close_price
      params:
        field: close

  # 이 프리셋의 "entry"는 매수 신호가 아니라 "전고점을 다시 하회함"이라는 경보 발생
  # 시점이다 - 원본 README도 category를 손절(stop_loss)로 분류한다. 화면에 노출할 때는
  # BUY 라벨 대신 "이탈 경보"처럼 카테고리에 맞는 문구로 바꿔야 한다(프론트 작업).
  entry:
    logic: AND
    conditions:
      - indicator: close_price
        operator: cross_below
        compare_to: resistance

  exit:
    logic: AND
    conditions:
      - indicator: close_price
        operator: cross_above
        compare_to: resistance

risk:
  stop_loss:
    enabled: true
    percent: 4.0
  take_profit:
    enabled: false
    percent: 8.0
  trailing_stop:
    enabled: false
    percent: 3.0
