version: "1.0"

metadata:
  name: "변동성 확장"
  description: "변동성이 종가 대비 3% 미만으로 수축된 상태에서 거래량 급증(20일 평균 대비 1.5배 이상)과 함께 20일 고점을 돌파하면 매수"
  author: "9Pay"
  tags: [volatility, breakout, contraction, volume]

strategy:
  id: volatility
  category: breakout

  indicators:
    # normalize: true - 절대 표준편차(원) 대신 '20일 평균 대비 %'로 계산해 가격대가
    # 다른 종목끼리도 같은 기준으로 비교할 수 있게 한다.
    - id: stddev
      alias: vol_pct
      params:
        period: 20
        normalize: true
    - id: highest
      alias: resistance
      params:
        period: 20
        field: high
        exclude_current: true
    - id: price
      alias: close_price
      params:
        field: close
    # 수축(vol_pct) + 돌파(close_price)만으로는 거래 없이 슬쩍 넘는 저거래량 돌파도
    # 잡혀서(2026-08 피드백) 거래량 급증 조건을 추가했다. week52_high.kis.yaml과 동일하게
    # disparity 지표를 field: volume으로 재사용(새 지표 코드 없음).
    - id: disparity
      alias: vol_surge
      params:
        period: 20
        field: volume
        basis: sma

  entry:
    logic: AND
    conditions:
      - indicator: vol_pct
        operator: less_than
        compare_to: 3
      - indicator: close_price
        operator: cross_above
        compare_to: resistance
      # week52_high.kis.yaml과 동일한 잠정 기준(1.5배) - 코멘트 참고.
      - indicator: vol_surge
        operator: greater_than
        compare_to: 150

  exit:
    logic: AND
    conditions:
      - indicator: close_price
        operator: cross_below
        compare_to: resistance

risk:
  stop_loss:
    enabled: true
    percent: 6.0
  take_profit:
    enabled: true
    percent: 15.0
  trailing_stop:
    enabled: true
    percent: 5.0
