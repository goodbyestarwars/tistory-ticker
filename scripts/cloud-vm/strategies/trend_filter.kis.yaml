version: "1.0"

metadata:
  name: "추세 필터"
  description: "종가가 60일 이동평균 위/아래 어느 쪽인지로 추세 방향을 따라 매매"
  author: "9Pay"
  tags: [ma, trend, filter]

strategy:
  id: trend_filter
  category: trend

  indicators:
    - id: sma
      alias: sma60
      params:
        period: 60
    - id: price
      alias: close_price
      params:
        field: close

  entry:
    logic: AND
    conditions:
      - indicator: close_price
        operator: greater_than
        compare_to: sma60

  exit:
    logic: AND
    conditions:
      - indicator: close_price
        operator: less_than
        compare_to: sma60

risk:
  stop_loss:
    enabled: true
    percent: 8.0
  take_profit:
    enabled: false
    percent: 15.0
  trailing_stop:
    enabled: false
    percent: 5.0
