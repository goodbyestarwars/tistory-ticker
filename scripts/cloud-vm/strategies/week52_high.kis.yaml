version: "1.0"

metadata:
  name: "52주 신고가"
  description: "종가가 직전 252거래일(약 52주) 고점을 거래량 급증(20일 평균 대비 1.5배 이상)과 함께 새로 넘어서면 매수, 20일선을 깨면 매도"
  author: "9Pay"
  tags: [breakout, week52, high, volume]

strategy:
  id: week52_high
  category: breakout

  indicators:
    # exclude_current: true - 오늘을 뺀 직전 252거래일 고점(=어제까지의 52주 신고가선).
    # 오늘 종가를 이 값과 비교해야 "오늘 새로 경신했는지"를 판정할 수 있다(오늘을 포함해
    # 계산하면 항상 자기 자신이 최댓값이 돼 버려 판정 자체가 성립하지 않는다).
    - id: highest
      alias: year_high
      params:
        period: 252
        field: high
        exclude_current: true
    - id: price
      alias: close_price
      params:
        field: close
    - id: sma
      alias: sma20
      params:
        period: 20
    # 거래량 뒷받침 없는 신고가는 힘이 약한 돌파일 수 있어(2026-08 피드백) 거래량 급증
    # 조건을 추가했다 - disparity 지표를 field: volume으로 써서 "오늘 거래량 / 20일 평균
    # 거래량 x 100"을 재사용(kisyaml_strategy.py의 _disparity 참고, 새 지표 코드 없음).
    - id: disparity
      alias: vol_surge
      params:
        period: 20
        field: volume
        basis: sma

  entry:
    logic: AND
    conditions:
      - indicator: close_price
        operator: greater_equal
        compare_to: year_high
      # 1.5배(=150) - 백테스트로 정한 값이 아니라 "평시 대비 눈에 띄게 거래가 붙었다"는
      # 잠정 기준. 20일 평균에 오늘 거래량 자체도 포함돼 계산되므로(exclude_current 미지원)
      # 실제 배수보다 살짝 낮게 나올 수 있다 - 운영 중 결과 보고 조정할 값.
      - indicator: vol_surge
        operator: greater_than
        compare_to: 150

  exit:
    logic: AND
    conditions:
      - indicator: close_price
        operator: less_than
        compare_to: sma20

risk:
  stop_loss:
    enabled: true
    percent: 10.0
  take_profit:
    enabled: true
    percent: 20.0
  trailing_stop:
    enabled: true
    percent: 8.0
