version: "1.0"

metadata:
  name: "모멘텀"
  description: "N일 수익률(ROC)이 기준치를 넘으면 매수, 마이너스로 돌아서면 매도"
  author: "9Pay"
  tags: [momentum, roc, trend]

strategy:
  id: momentum
  category: trend

  indicators:
    - id: roc
      alias: mom20
      params:
        period: 20
        field: close

  entry:
    logic: AND
    conditions:
      - indicator: mom20
        operator: greater_than
        compare_to: 5

  exit:
    logic: AND
    conditions:
      - indicator: mom20
        operator: less_than
        compare_to: 0

risk:
  stop_loss:
    enabled: true
    percent: 7.0
  take_profit:
    enabled: true
    percent: 15.0
  trailing_stop:
    enabled: false
    percent: 5.0
