version: "1.0"

metadata:
  name: "이격도"
  description: "종가가 20일 이동평균 대비 8% 넘게 아래로 벌어지면(과매도) 매수, 평균선을 회복하면 매도"
  author: "9Pay"
  tags: [disparity, ma, reversion]

strategy:
  id: disparity
  category: reversion

  indicators:
    # disparity(이격도) = 종가 / 20일 SMA * 100. 100=이동평균과 동일, 100 미만이면
    # 이동평균 아래로 이탈한 상태.
    - id: disparity
      alias: disp20
      params:
        period: 20
        basis: sma

  entry:
    logic: AND
    conditions:
      - indicator: disp20
        operator: less_than
        compare_to: 92

  exit:
    logic: AND
    conditions:
      - indicator: disp20
        operator: greater_equal
        compare_to: 100

risk:
  stop_loss:
    enabled: true
    percent: 6.0
  take_profit:
    enabled: true
    percent: 12.0
  trailing_stop:
    enabled: false
    percent: 4.0
