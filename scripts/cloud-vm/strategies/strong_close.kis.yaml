version: "1.0"

metadata:
  name: "강한 종가"
  description: "당일 고가-저가 구간에서 종가가 상위 20% 안에 위치하면(강한 마감) 매수"
  author: "9Pay"
  tags: [range, close, momentum]

strategy:
  id: strong_close
  category: momentum

  indicators:
    # range_position = (종가-저가) / (고가-저가) * 100. 100=고가 마감, 0=저가 마감.
    - id: range_position
      alias: close_pos

  entry:
    logic: AND
    conditions:
      - indicator: close_pos
        operator: greater_equal
        compare_to: 80

  exit:
    logic: AND
    conditions:
      - indicator: close_pos
        operator: less_than
        compare_to: 50

risk:
  stop_loss:
    enabled: true
    percent: 5.0
  take_profit:
    enabled: true
    percent: 10.0
  trailing_stop:
    enabled: false
    percent: 3.0
