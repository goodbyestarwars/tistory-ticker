version: "1.0"

metadata:
  name: "평균회귀"
  description: "종가가 10일 지수이동평균 대비 10% 넘게 이탈하면 매수, 평균선을 회복하면 매도"
  author: "9Pay"
  tags: [mean-reversion, ema, reversion]

strategy:
  id: mean_reversion
  category: reversion

  indicators:
    # disparity(평균회귀)는 'disparity(이격도)' 프리셋과 같은 계산식(종가/기준선*100)을
    # 쓰되, 기준선을 20일 SMA 대신 더 빠르게 반응하는 10일 EMA로 잡아 구분한다.
    - id: disparity
      alias: dev10
      params:
        period: 10
        basis: ema

  entry:
    logic: AND
    conditions:
      - indicator: dev10
        operator: less_than
        compare_to: 90

  exit:
    logic: AND
    conditions:
      - indicator: dev10
        operator: greater_equal
        compare_to: 100

risk:
  stop_loss:
    enabled: true
    percent: 6.0
  take_profit:
    enabled: true
    percent: 10.0
  trailing_stop:
    enabled: false
    percent: 4.0
