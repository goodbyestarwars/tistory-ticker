<text x="42" y="899" class="muted" font-size="14">표시된 10호가 잔량 합계</text>
<text x="42" y="929" class="blue" font-size="17" font-weight="700">매도 1,687</text>
<text x="442" y="929" class="red" font-size="17" font-weight="700" text-anchor="end">매수 6,002</text>
<rect x="42" y="945" width="89" height="10" rx="4" fill="#1261c4"/>
<rect x="131" y="945" width="316" height="10" rx="4" fill="#d24f45"/>
<text x="43" y="992" class="muted small">매수 잔량이 더 많지만 주문은 언제든 취소될 수 있다.</text>
<text x="43" y="1018" class="muted small">잔량 합계만으로 급등을 판단하지 않는다.</text>
<rect x="486" y="145" width="409" height="145" rx="8" fill="#fffefc" stroke="#dde3e9"/>
<circle cx="519" cy="183" r="19" fill="#1261c4" opacity=".1"/>
<text x="519" y="189" fill="#1261c4" text-anchor="middle" font-size="18" font-weight="750">1</text>
<text x="550" y="188" class="ink" font-size="17" font-weight="700">매도호가가 얇은 구간</text>
<text x="550" y="228" class="muted explain">5,230원에 42주, 5,240원에 20주.</text>
<text x="550" y="252" class="muted explain">즉시 매수량에 따라 빠르게 지나갈 수 있다.</text>
<rect x="486" y="304" width="409" height="145" rx="8" fill="#fffefc" stroke="#dde3e9"/>
<circle cx="519" cy="342" r="19" fill="#c43c33" opacity=".1"/>
<text x="519" y="348" fill="#c43c33" text-anchor="middle" font-size="18" font-weight="750">2</text>
<text x="550" y="347" class="ink" font-size="17" font-weight="700">아래에 쌓인 매수 주문</text>
<text x="550" y="387" class="muted explain">5,190원과 5,180원에 매수 주문이</text>
<text x="550" y="411" class="muted explain">상대적으로 많지만 언제든 바뀔 수 있다.</text>
<rect x="486" y="463" width="409" height="145" rx="8" fill="#fffefc" stroke="#dde3e9"/>
<circle cx="519" cy="501" r="19" fill="#1261c4" opacity=".1"/>
<text x="519" y="507" fill="#1261c4" text-anchor="middle" font-size="18" font-weight="750">3</text>
<text x="550" y="506" class="ink" font-size="17" font-weight="700">매도벽이 실제로 소화됐나</text>
<text x="550" y="546" class="muted explain">호가 수량이 줄어든 원인이 실제 체결인지,</text>
<text x="550" y="570" class="muted explain">주문 취소인지 구분해야 한다.</text>
<rect x="486" y="622" width="409" height="145" rx="8" fill="#fffefc" stroke="#dde3e9"/>
<circle cx="519" cy="660" r="19" fill="#c43c33" opacity=".1"/>
<text x="519" y="666" fill="#c43c33" text-anchor="middle" font-size="18" font-weight="750">4</text>
<text x="550" y="665" class="ink" font-size="17" font-weight="700">한 칸씩 올라가는 체결</text>
<text x="550" y="705" class="muted explain">5,210원 위의 호가를 매수 주문이</text>
<text x="550" y="729" class="muted explain">실제로 체결하며 올라가는지 확인한다.</text>
<rect x="486" y="781" width="409" height="145" rx="8" fill="#fffefc" stroke="#dde3e9"/>
<circle cx="519" cy="819" r="19" fill="#1261c4" opacity=".1"/>
<text x="519" y="825" fill="#1261c4" text-anchor="middle" font-size="18" font-weight="750">5</text>
<text x="550" y="824" class="ink" font-size="17" font-weight="700">다른 지표와 함께 확인</text>
<text x="550" y="864" class="muted explain">체결강도와 거래량, 호가 재충전을</text>
<text x="550" y="888" class="muted explain">함께 보고 단순 잔량 비율에 의존하지 않는다.</text>
<rect x="486" y="948" width="409" height="117" rx="8" fill="#f6f4ef" stroke="#dcd7cd"/>
<text x="505" y="979" class="ink" font-size="18" font-weight="700">주의</text>
<text x="505" y="1010" class="muted" font-size="14">정적인 호가 스냅샷은 상승 신호가 아니다.</text>
<text x="505" y="1035" class="muted" font-size="14">허수 주문과 지연 시세, 거래량을 확인한다.</text>
<text x="27" y="1095" class="muted small">9Pay 증권 · 교육용으로 재구성한 가상 호가 예시 · 투자 권유 아님</text>
</svg>
