<svg xmlns="http://www.w3.org/2000/svg" width="920" height="1116" viewBox="0 0 920 1116" role="img" aria-labelledby="t d">
<title id="t">상승 시도 호가창에서 확인할 다섯 가지</title>
<desc id="d">왼쪽은 5200원 주변의 매도와 매수 10호가, 오른쪽은 매도 호가의 두께, 매수 받침, 실제 체결, 거래량 확인 요령을 설명한다. 매매 추천이나 상승 예측이 아니다.</desc>
<style>text{font-family:"Pretendard","Malgun Gothic",Arial,sans-serif}.ink{fill:#283342}.muted{fill:#64748b}.blue{fill:#1261c4}.red{fill:#c43c33}.line{stroke:#e5e7eb}.price{font-weight:700;font-size:17px}.small{font-size:13px}.explain{font-size:15px}</style>
<rect width="920" height="1116" fill="#fefdfa"/>
<text x="25" y="47" class="ink" font-weight="700" font-size="29">호가창에서 볼 만한 상승 시도 구조</text>
<text x="27" y="76" class="muted" font-size="15">매도 잔량 · 매수 받침 · 체결 흐름을 함께 본다</text>
<text x="27" y="101" class="muted small">호가창 한 장은 순간 기록이다. 변화를 보려면 시간순 데이터를 확인해야 한다.</text>
